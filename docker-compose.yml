services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gym_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - gym_network
    restart: unless-stopped

  backend:
    build: ./Backend             
    container_name: gym_backend
    environment:
      - DB_SERVER=sqlserver
      - DB_USER=sa
      - DB_PASSWORD=YourStrong!Password123
      - DB_DATABASE=DB_GYM_ENTERPRISE
      - JWT_SECRET=tu_secreto_super_seguro
      - JWT_EXPIRES_IN=8h
      - FRONTEND_URL=http://localhost
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - sqlserver
    networks:
      - gym_network
    restart: unless-stopped

  frontend:
    build: ./gym-frontend      
    container_name: gym_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gym_network
    restart: unless-stopped

networks:
  gym_network:
    driver: bridge

volumes:
  sql_data: